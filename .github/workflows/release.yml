name: PyPI Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  sdist:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pymsbuild
    - name: Build sdist
      run: python -m pymsbuild -d dist sdist
      env:
        GITHUB_REF: ${{ github.ref }}
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-sdist
        path: dist/

  wheels:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        platform: [win_amd64, win_arm64]
        exclude:
          # There are no ARM64 builds of CPython before 3.9
          - python-version: '3.8'
            platform: win_arm64
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pymsbuild
    - name: Get Python ${{ matrix.python-version }} headers and libs
      uses: ./.github/actions/python-nuget
      with:
        python-version: ${{ matrix.python-version }}
        platform: ${{ matrix.platform }}
    - name: Build wheel
      run: python -m pymsbuild -d dist wheel
      env:
        GITHUB_REF: ${{ github.ref }}
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.python-version }}-${{ matrix.platform }}
        path: dist/

  publish:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyfindvs/
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        merge-multiple: true
        path: dist/
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
