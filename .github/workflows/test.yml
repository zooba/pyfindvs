name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Set up dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'
      if: ${{ matrix.os != 'windows-latest' }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pymsbuild
    - name: Test with pytest
      run: python -m pytest
    - name: Check self build (sdist)
      run: python -m pymsbuild sdist
    - name: Check self build (wheel)
      # The native _helper extension is Windows-only (it uses the VS Setup
      # Configuration COM API), so only attempt a real wheel build here.
      if: ${{ matrix.os == 'windows-latest' }}
      run: python -m pymsbuild wheel
