name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pymsbuild
    - name: Test with pytest
      run: python -m pytest
    - name: Check self build (sdist)
      run: python -m pymsbuild sdist
    - name: Check self build (wheel)
      run: python -m pymsbuild wheel
    # ARM64 cannot run on the (x64) runner, so only check that it compiles.
    # There are no ARM64 builds of CPython before 3.9.
    - name: Get Python ${{ matrix.python-version }} headers and libs (ARM64)
      if: matrix.python-version != '3.8'
      uses: ./.github/actions/python-nuget
      with:
        python-version: ${{ matrix.python-version }}
        platform: win_arm64
    - name: Check cross build (win_arm64 wheel)
      if: matrix.python-version != '3.8'
      run: python -m pymsbuild --temp-dir build/arm64 wheel
